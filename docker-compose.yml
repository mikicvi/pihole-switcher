services:
    pihole-switcher:
        image: mikicv/pihole-switcher:latest
        ports:
            - '3016:3000'
        environment:
            # FTL host; default assumes Docker bridge gateway to the host net
            - PIHOLE_PROXY_TARGET=${PIHOLE_PROXY_TARGET:-172.17.0.1}
            - PIHOLE_FTL_PORT=${PIHOLE_FTL_PORT:-1010}
            # Required: the plain Pi-hole FTL API password (server-side only)
            - PIHOLE_API_PASSWORD=${PIHOLE_API_PASSWORD}
            # Optional: public admin URL linked from the UI
            - PUBLIC_PIHOLE_ADMIN=${PUBLIC_PIHOLE_ADMIN:-}
        restart: unless-stopped
        pull_policy: always

name: Build and Push Docker Images

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
        types: [closed]
    workflow_dispatch:

permissions:
    contents: read
    actions: write

concurrency:
    group: docker-publish-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    build-and-push:
        # Merges to master are published by the explicit push run; GitHub also
        # synthesizes pull_request/dynamic runs on merge, which the gate skips
        # so exactly one run executes (concurrent runs race on the GHA cache
        # reservation and fail with "failed to reserve cache"). Manual dispatch
        # keeps the original owner-only authorization.
        if: >-
            (github.event_name == 'workflow_dispatch' && github.actor == 'mikicvi') ||
            (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
            (github.event_name == 'pull_request' &&
                github.event.pull_request.merged == true &&
                github.base_ref != 'master')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: linux/amd64,linux/arm64,linux/arm/v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Install dependencies and build
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'yarn'

            - name: Build
              run: |
                  yarn install
                  yarn build

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: mikicv/pihole-switcher
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/amd64,linux/arm64,linux/arm/v7
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

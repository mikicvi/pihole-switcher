name: Build and Push Docker Images

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
        types: [closed]
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read
    actions: write

concurrency:
    group: >-
        docker-publish-${{ github.event_name }}-
        ${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    build-and-push:
        # Merges to master are published by the explicit push run; GitHub also
        # synthesizes pull_request/dynamic runs on merge, which the gate skips
        # so exactly one run executes (concurrent runs race on the GHA cache
        # reservation and fail with "failed to reserve cache"). Manual dispatch
        # keeps the original owner-only authorization.
        if: >-
            (github.event_name == 'workflow_dispatch' &&
                github.actor == 'mikicvi') ||
            (github.event_name == 'push' &&
                github.ref == 'refs/heads/master') ||
            (github.event_name == 'pull_request' &&
                github.event.pull_request.merged == true &&
                github.base_ref != 'master') ||
            github.event_name == 'release'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: linux/amd64,linux/arm64,linux/arm/v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            # The image builds itself (Dockerfile runs npm ci + vite build);
            # this step validates that the app builds before spending a
            # multi-platform docker build.
            - name: Install dependencies and build
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Build
              run: |
                  npm ci
                  npm run build

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: mikicv/pihole-switcher
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{raw}}
                      type=semver,pattern={{version}}
                      type=sha,prefix={{branch}}-
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/amd64,linux/arm64,linux/arm/v7
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    # GitHub releases: attach each platform's image as a loadable tarball
    # (docker load < pihole-switcher_v1.0.0_linux-arm64.tar.gz). Only runs
    # for published releases; the multi-arch manifest lives on Docker Hub.
    attach-images:
        if: github.event_name == 'release'
        needs: build-and-push
        runs-on: ubuntu-latest
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                platform: [linux/amd64, linux/arm64, linux/arm/v7]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              with:
                  platforms: ${{ matrix.platform }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build single-platform image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: false
                  load: true
                  tags: pihole-switcher:${{ matrix.platform }}
                  platforms: ${{ matrix.platform }}
                  cache-from: type=gha

            - name: Save and upload image tarball
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.event.release.tag_name }}
                  PLATFORM: ${{ matrix.platform }}
              run: |
                  fname="pihole-switcher_${TAG}_${PLATFORM//\//_}.tar.gz"
                  docker save "pihole-switcher:${PLATFORM}" | gzip > "${fname}"
                  gh release upload "${TAG}" "${fname}" --clobber

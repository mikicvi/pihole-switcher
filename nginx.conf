server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy for the Pi-hole/FTL API.
    # Serves the API from the app's own origin so the browser never makes a
    # cross-origin request. This works around an upstream FTL bug where
    # responses for /api/domains|clients|groups lack the
    # Access-Control-Allow-Origin header (pi-hole/FTL#2261), which breaks
    # same-credential cross-origin fetches from this app.
    location /api/ {
        proxy_pass http://${PIHOLE_PROXY_TARGET}:1010/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
